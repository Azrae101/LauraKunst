<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#f7f4ee">
  <title>Virtuelt museum | Laura Kruuse</title>
  <meta name="description" content="Gå en tur gennem Laura Kruuses malerier i et virtuelt museum.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Cinzel:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---------- Virtual museum ----------
       The hall is a horizontal scroller. Paintings, visitors (the shadow people),
       the sketch board and the ending sit side by side as flex items, so a visitor
       can never be drawn on top of a painting. Sizes use cqh (1% of the hall's height),
       so everything scales with the screen. */
    :root {
      --gold: #d4af37;
      --gold-soft: #f5e6c8;
      --wall-1: #2b241a;
      --wall-2: #3a3028;
      --card: rgba(18, 16, 30, 0.88);
      --cinzel: "Cinzel", Georgia, serif;
    }
    body.museum-page {
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
      padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
      padding-bottom: 0;
      background: #14110c;
    }
    .museum { position: relative; flex: 1 1 auto; min-height: 0; color: var(--gold-soft); }

    .hall {
      container: hall / size;
      position: absolute; inset: 0;
      overflow-x: auto; overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin; scrollbar-color: #8b5a2b rgba(0,0,0,0.3);
    }
    .hall:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
    @media (pointer: coarse) { .hall { scroll-snap-type: x mandatory; } }

    .track {
      --floor: 22cqh;
      --wall: calc(100cqh - var(--floor));
      position: relative;
      display: flex; align-items: stretch;
      width: max-content; height: 100%;
      padding-inline: 6vw;
      background:
        /* shadow where wall meets floor */
        linear-gradient(to bottom, transparent var(--wall), rgba(0,0,0,0.55) var(--wall), transparent calc(var(--wall) + 2.5cqh)),
        /* wall panels */
        repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 140px) top / 100% var(--wall) no-repeat,
        /* wall and concrete floor */
        linear-gradient(to bottom, var(--wall-1) 0, var(--wall-2) 45%, #2a2318 var(--wall), #66645f var(--wall), #4b4945 100%);
    }

    /* Every stop the arrows move between */
    .stop {
      position: relative; flex: none;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(1rem, 3vw, 2.5rem);
      padding: 2cqh 3vw var(--floor);
      scroll-snap-align: center;
    }
    /* spotlight from the ceiling */
    .stop::before {
      content: ""; position: absolute; inset: 0 0 var(--floor); pointer-events: none;
      background: radial-gradient(ellipse 55% 70% at 50% 0%, rgba(255, 226, 170, 0.16), transparent 72%);
    }
    .stop > * { position: relative; }

    /* Visitors: their own column, standing on the floor */
    .visitor {
      flex: none; align-self: flex-end;
      height: 48cqh;
      margin: 0 1vw calc(var(--floor) * 0.3);
      pointer-events: none;
      opacity: 0.92;
      filter: drop-shadow(0 2cqh 2.5cqh rgba(0, 0, 0, 0.85));
    }
    .visitor img { height: 100%; width: auto; max-width: none; }
    .visitor.flip img { transform: scaleX(-1); }

    /* Painting frame */
    .frame {
      --pw: min(calc(58cqh * var(--ar)), 46vw);
      display: block; flex: none; padding: clamp(8px, 2cqh, 20px);
      border: 0; border-radius: 3px; cursor: pointer;
      background: linear-gradient(135deg, #6e4520, #d4af37 28%, #8b5a2b 52%, #c9a24a 78%, #6e4520);
      box-shadow: 0 3cqh 6cqh rgba(0,0,0,0.75), inset 0 0 0 2px rgba(255,235,180,0.35), inset 0 0 12px rgba(0,0,0,0.6);
      transition: box-shadow 0.4s, transform 0.4s;
    }
    .frame:hover { box-shadow: 0 3cqh 6cqh rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.45), inset 0 0 0 2px rgba(255,235,180,0.5); }
    .frame:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 6px; }
    .frame img { display: block; width: var(--pw); height: auto; max-width: none; box-shadow: 0 0 0 3px #1a140c, 0 0 18px rgba(0,0,0,0.6); background: #000; }
    .frame.photo { cursor: default; }
    .frame.photo:hover { box-shadow: 0 3cqh 6cqh rgba(0,0,0,0.75), inset 0 0 0 2px rgba(255,235,180,0.35), inset 0 0 12px rgba(0,0,0,0.6); }

    /* Placard next to each painting */
    .placard {
      width: clamp(240px, 26vw, 340px); max-height: 60cqh; overflow-y: auto;
      background: var(--card); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px;
      padding: clamp(1rem, 2.4cqh, 1.6rem);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      line-height: 1.65; overflow-wrap: break-word;
      scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.5) transparent;
    }
    .placard .kicker { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: #b8a580; margin-bottom: 0.4rem; }
    .placard h2 { font-family: var(--cinzel); font-weight: 400; color: var(--gold); font-size: clamp(1.15rem, 2.2vw, 1.5rem); line-height: 1.25; margin-bottom: 0.7rem; }
    .placard p { font-size: 0.93rem; margin-bottom: 0.8rem; }
    .placard dl { font-size: 0.82rem; color: #b8a580; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 0.7rem; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.8rem; }
    .placard dt { color: var(--gold); }
    .placard .open { margin-top: 1rem; }
    .m-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 44px;
      padding: 0 1.2rem; border-radius: 999px; cursor: pointer; text-decoration: none;
      font: 400 0.85rem/1 var(--sans); letter-spacing: 0.06em;
      color: var(--gold); background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.5);
      transition: background 0.25s, color 0.25s;
    }
    .m-btn:hover { background: var(--gold); color: #1a140c; }
    .m-btn.solid { background: var(--gold); color: #1a140c; }
    .m-btn.solid:hover { background: var(--gold-soft); }

    /* Artist / welcome */
    .welcome .placard { width: clamp(260px, 30vw, 420px); }
    .welcome h1 { font-family: var(--cinzel); font-weight: 400; color: var(--gold-soft); font-size: clamp(1.5rem, 3vw, 2.2rem); letter-spacing: 0.08em; line-height: 1.2; margin-bottom: 0.9rem; }
    .welcome .social-row { margin-top: 1rem; }
    .museum .social-pill { color: var(--gold); border-color: rgba(212,175,55,0.45); }
    .museum .social-pill:hover { background: var(--gold); color: #1a140c; border-color: var(--gold); }

    /* Behind the scenes: cork board with post-it notes */
    .board {
      width: min(980px, 70vw); max-height: 70cqh; overflow-y: auto;
      padding: clamp(1rem, 3cqh, 2rem);
      border: clamp(8px, 1.6cqh, 16px) solid #8b5a2b; border-radius: 4px;
      background:
        repeating-linear-gradient(45deg, #c4884d 0 1px, #b37940 1px 2px) 0 0 / 8px 8px,
        radial-gradient(circle at 30% 40%, #d4a573, #b37940);
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.3);
      scrollbar-width: thin; scrollbar-color: #8b5a2b transparent;
    }
    .board h2 { font-family: var(--cinzel); font-weight: 700; text-align: center; color: #6e4520; letter-spacing: 0.1em; text-transform: uppercase; font-size: clamp(1.1rem, 2.4vw, 1.9rem); text-shadow: 0 1px 0 rgba(255,255,255,0.2); }
    .board .sub { text-align: center; color: #4a2f15; font-family: "Patrick Hand", cursive; font-size: 1.05rem; margin-bottom: clamp(0.8rem, 2.5cqh, 1.6rem); }
    .notes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(0.8rem, 2vw, 1.6rem); align-items: start; }
    .note {
      position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
      background: linear-gradient(135deg, #fffacd, #fff3a8); color: #2c2c2c; border: 0; border-radius: 2px;
      padding: 1.1rem 0.8rem 0.8rem; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .note::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b); box-shadow: 0 2px 3px rgba(0,0,0,0.35); }
    .note:nth-child(4n+1) { transform: rotate(-2.5deg); }
    .note:nth-child(4n+2) { transform: rotate(1.8deg) translateY(-6px); }
    .note:nth-child(4n+3) { transform: rotate(-1deg) translateY(8px); }
    .note:nth-child(4n+4) { transform: rotate(2.4deg); }
    .note:hover, .note:focus-visible { transform: rotate(0) scale(1.04); box-shadow: 0 14px 30px rgba(0,0,0,0.4); z-index: 2; }
    .note img { width: 100%; height: clamp(70px, 20cqh, 220px); object-fit: cover; border-radius: 2px; margin-bottom: 0.6rem; }
    .note h3 { font-family: var(--cinzel); color: #8b5a2b; font-size: 0.95rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.3rem; }
    .note p { font-family: "Patrick Hand", cursive; font-size: 1rem; line-height: 1.3; }

    /* Ending */
    .ending .placard { width: min(520px, 80vw); text-align: center; }
    .ending h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); }
    .ending .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 1.2rem; }
    .ending .social-row { justify-content: center; }
    .ending .fin { margin-top: 1.2rem; font-style: italic; opacity: 0.75; font-family: var(--cinzel); font-size: 0.85rem; }

    /* Arrows and hint over the hall */
    .hall-nav {
      position: absolute; top: 39%; transform: translateY(-50%); z-index: 5;
      width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
      background: rgba(139, 90, 43, 0.9); color: var(--gold-soft); border: 2px solid rgba(212,175,55,0.5);
      transition: background 0.25s, opacity 0.25s;
    }
    .hall-nav:hover { background: #a67c52; }
    .hall-nav[disabled] { opacity: 0; pointer-events: none; }
    .hall-nav svg { width: 22px; height: 22px; }
    .hall-nav.prev { left: max(10px, env(safe-area-inset-left, 0px)); }
    .hall-nav.next { right: max(10px, env(safe-area-inset-right, 0px)); }
    .hall-hint {
      position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 5;
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(245,230,200,0.85);
      background: rgba(0,0,0,0.45); padding: 0.4rem 0.9rem; border-radius: 999px; white-space: nowrap;
      pointer-events: none; transition: opacity 0.6s;
    }
    .hall-hint.gone { opacity: 0; }

    /* Viewer */
    .m-viewer {
      width: min(1100px, 100% - 1.5rem); max-height: calc(100dvh - 1.5rem); margin: auto; padding: 0;
      border: 1px solid rgba(212,175,55,0.35); border-radius: 10px;
      background: #15121c; color: var(--gold-soft); overflow: hidden;
    }
    .m-viewer::backdrop { background: rgba(0,0,0,0.88); }
    .mv-inner { display: grid; max-height: calc(100dvh - 1.5rem); overflow-y: auto; }
    .mv-art { background: #000; display: grid; place-items: center; padding: 1rem; }
    .mv-art img { max-height: 60dvh; width: auto; object-fit: contain; }
    .mv-info { padding: 1.5rem 1.4rem 2rem; line-height: 1.7; }
    .mv-info h2 { font-family: var(--cinzel); font-weight: 400; color: var(--gold); font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.2; margin: 0 2.5rem 1rem 0; border-bottom: 1px solid rgba(212,175,55,0.4); padding-bottom: 0.6rem; }
    .mv-info p { margin-bottom: 1rem; }
    .mv-info dl { font-size: 0.88rem; color: #b8a580; display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 1rem; border-top: 1px solid rgba(212,175,55,0.25); padding-top: 0.9rem; }
    .mv-info dt { color: var(--gold); }
    .mv-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.4rem; }
    .mv-close, .mv-step {
      position: absolute; z-index: 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
      background: rgba(0,0,0,0.65); color: var(--gold-soft); border: 1px solid rgba(212,175,55,0.5); font-size: 1.5rem; line-height: 1;
    }
    .mv-step[hidden] { display: none; }
    .mv-close { top: 0.6rem; right: 0.6rem; }
    .mv-step { top: 30dvh; transform: translateY(-50%); }
    .mv-step.prev { left: 0.6rem; }
    .mv-step.next { right: 0.6rem; }
    .mv-step svg { width: 20px; height: 20px; }
    .mv-close:hover, .mv-step:hover { background: var(--gold); color: #1a140c; }
    @media (min-width: 800px) {
      .mv-inner { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
      .mv-art { min-height: 70dvh; }
      .mv-art img { max-height: calc(100dvh - 4rem); }
      .mv-info { padding: 3rem 2.2rem; align-self: center; }
      .mv-step { top: 50%; }
      .mv-step.next { right: calc(100% / 2.2 + 0.6rem); }
    }

    /* ---------- Portrait screens (phones): stack the placard under the painting ---------- */
    @container hall (orientation: portrait) {
      .track { --floor: 15cqh; padding-inline: 4vw; }
      .stop { flex-direction: column; justify-content: center; gap: 2cqh; width: 84vw; padding: 1.5cqh 0 calc(var(--floor) + 1cqh); }
      .frame { --pw: min(calc(42cqh * var(--ar)), 74vw); }
      .welcome .frame { --pw: min(calc(32cqh * var(--ar)), 74vw); }
      .placard, .welcome .placard { width: 100%; max-height: 34cqh; }
      .welcome .placard { max-height: 44cqh; }
      .visitor { height: 32cqh; margin-inline: 0; }
      .board { width: 100%; max-height: 80cqh; }
      .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .note img { height: clamp(60px, 13cqh, 160px); }
      .ending .placard { max-height: 80cqh; }
    }
    /* Short, wide screens (phones held sideways) */
    @container hall (orientation: landscape) and (max-height: 460px) {
      .track { --floor: 14cqh; }
      .frame { --pw: min(calc(70cqh * var(--ar)), 40vw); padding: 6px; }
      .placard { max-height: 80cqh; }
      .visitor { height: 58cqh; }
      .board { max-height: 84cqh; }
      .note img { height: 26cqh; }
      .notes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 599px) {
      .hall-nav { width: 40px; height: 40px; }
      .hall-hint { font-size: 0.68rem; letter-spacing: 0.08em; }
    }
  </style>
</head>
<body class="museum-page" data-title="meta.museum">

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Laura Kruuse</a>
    <nav data-i18n-aria="nav.main" aria-label="Hovedmenu">
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#top" data-i18n="nav.home">Forside</a></li>
        <li data-auction><a href="auction.html" data-i18n="nav.auction">Auktion</a></li>
        <li><a href="index.html#prints" data-i18n="nav.prints">Prints</a></li>
        <li><a href="index.html#om-mig" data-i18n="nav.about">Om mig</a></li>
        <li><a href="museum.html" aria-current="page" data-i18n="nav.museum">Museum</a></li>
        <li><a href="index.html#kontakt" data-i18n="nav.contact">Kontakt</a></li>

    <button class="lang-btn" type="button" aria-label="Switch to English"><span class="lang-short">EN</span></button>
    <button class="basket-btn" type="button" aria-haspopup="dialog"><span class="label" data-i18n="nav.basket">Kurv</span><span class="count">0</span><span class="sr-only" data-i18n="nav.items">varer i kurven</span></button>
    <button class="nav-toggle" type="button" aria-controls="navLinks" aria-expanded="false" data-i18n-aria="nav.menu" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="museum">
  <div class="hall" id="hall" tabindex="0" role="region" data-i18n-aria="museum.region" aria-label="Virtuelt museum">
    <div class="track" id="track"></div>
  </div>
  <button class="hall-nav prev" id="hallPrev" type="button" data-i18n-aria="museum.prev" aria-label="Forrige værk" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <button class="hall-nav next" id="hallNext" type="button" data-i18n-aria="museum.next" aria-label="Næste værk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>
  <p class="hall-hint" id="hallHint" data-i18n="museum.hint">Swipe, rul eller brug pilene for at gå videre</p>
</main>

<dialog class="m-viewer" id="mViewer" aria-labelledby="mv-title">
  <button class="mv-close" type="button" data-i18n-aria="close" aria-label="Luk">×</button>
  <button class="mv-step prev" type="button" data-i18n-aria="museum.prev" aria-label="Forrige værk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="mv-step next" type="button" data-i18n-aria="museum.next" aria-label="Næste værk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  <div class="mv-inner" id="mvInner"></div>
</dialog>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/site.js"></script>
<script>
/* The museum is built from ARTWORKS and SKETCHES in js/config.js,
   so a new painting added there also gets hung here automatically. */
(() => {
  const hall = $("#hall"), track = $("#track"), hint = $("#hallHint");
  const prevBtn = $("#hallPrev"), nextBtn = $("#hallNext");
  const mv = $("#mViewer"), mvInner = $("#mvInner");
  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

  /* The shadow people. Sizes are the pictures' pixel sizes, so their column
     is the right width before the picture has loaded. */
  const PEOPLE = { p1: [992, 992], p2: [241, 686], p3: [188, 615], p4: [291, 858], p5: [900, 1800], p6: [433, 1497] };
  // Who stands after each painting, in order. Repeats if more paintings are added.
  const AFTER_PAINTING = [["p1"], ["p2", "p5:flip"], ["p4"]];
  const person = (spec) => {
    const [id, flip] = spec.split(":"); const [w, h] = PEOPLE[id];
    return `<div class="visitor${flip ? " flip" : ""}" aria-hidden="true"><img src="${id}.png" width="${w}" height="${h}" alt="" loading="lazy" decoding="async"></div>`;
  };
  const ratio = (o) => (o.w / o.h).toFixed(4);

  let auctionIds = new Set();
  const facts = (a) => `<dl>
      <dt>${t("museum.medium")}</dt><dd>${esc(L(a.medium))}</dd>
      <dt>${t("museum.size")}</dt><dd>${esc(a.size)}</dd>
      ${a.year ? `<dt>${t("museum.year")}</dt><dd>${esc(a.year)}</dd>` : ""}
    </dl>`;

  function render() {
    const keep = hall.scrollLeft;
    const parts = [];

    parts.push(`<section class="stop welcome" aria-labelledby="m-welcome">
      <div class="frame photo" style="--ar:${ratio({ w: 1400, h: 1230 })}"><img src="images/laura.jpg" width="1400" height="1230" alt="Laura Kruuse"></div>
      <div class="placard">
        <p class="kicker">${t("museum.welcome")}</p>
        <h1 id="m-welcome">Laura Kruuse</h1>
        <p>${esc(t("about.p1"))}</p>
        <p>${esc(t("about.p2"))}</p>
        <div class="social-row" data-auto></div>
      </div>
    </section>`);
    parts.push(person("p3"));

    ARTWORKS.forEach((a, i) => {
      parts.push(`<section class="stop exhibit" aria-labelledby="m-${esc(a.id)}">
        <button class="frame" type="button" data-open="${i}" style="--ar:${ratio(a)}" aria-label="${t("museum.open")}: ${esc(a.title)}">
          <img src="${esc(a.image)}" width="${a.w}" height="${a.h}" alt="${esc(a.title)}" loading="${i ? "lazy" : "eager"}" decoding="async">
        </button>
        <div class="placard">
          <p class="kicker">Laura Kruuse${a.year ? ", " + esc(a.year) : ""}</p>
          <h2 id="m-${esc(a.id)}">${esc(a.title)}</h2>
          <p>${esc(L(a.description))}</p>
          ${facts(a)}
          <button class="m-btn open" type="button" data-open="${i}">${t("museum.open")}</button>
        </div>
      </section>`);
      AFTER_PAINTING[i % AFTER_PAINTING.length].forEach(p => parts.push(person(p)));
    });

    parts.push(`<section class="stop bts" aria-labelledby="m-bts">
      <div class="board">
        <h2 id="m-bts">${t("museum.bts")}</h2>
        <p class="sub">${t("museum.btsP")}</p>
        <div class="notes">${SKETCHES.map((s, i) => `
          <button class="note" type="button" data-sketch="${i}">
            <img src="${esc(s.image)}" width="${s.w}" height="${s.h}" alt="" loading="lazy" decoding="async">
            <h3>${esc(L(s.title))}</h3>
            <p>${esc(L(s.desc))}</p>
          </button>`).join("")}
        </div>
      </div>
    </section>`);
    parts.push(person("p6"));

    parts.push(`<section class="stop ending" aria-labelledby="m-end">
      <div class="placard">
        <h2 id="m-end">${t("museum.thanksH")}</h2>
        <p>${t("museum.thanksP")}</p>
        <div class="actions">
          <a class="m-btn solid" href="index.html#prints">${t("viewer.print")}</a>
          ${AUCTION ? `<a class="m-btn" href="auction.html">${t("viewer.bid")}</a>` : ""}
        </div>
        <div class="social-row" data-auto></div>
        <p class="fin">~ ${t("museum.end")} ~</p>
        <button class="m-btn" type="button" id="m-restart" style="margin-top:0.8rem">${t("museum.restart")}</button>
      </div>
    </section>`);

    track.innerHTML = parts.join("");
    fillSocialRows();
    hall.scrollLeft = keep;
    updateArrows();
    if (mv.open) renderViewer();
  }

  /* ---------- Moving between stops ---------- */
  const stops = () => $$(".stop", track);
  const centerOf = (el) => el.offsetLeft + el.offsetWidth / 2 - hall.clientWidth / 2;
  function currentStop() {
    const mid = hall.scrollLeft + hall.clientWidth / 2;
    let best = 0, dist = Infinity;
    stops().forEach((s, i) => { const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid); if (d < dist) { dist = d; best = i; } });
    return best;
  }
  function goTo(i) {
    const list = stops(); const s = list[Math.max(0, Math.min(list.length - 1, i))];
    if (s) hall.scrollTo({ left: centerOf(s), behavior: smooth() });
  }
  function updateArrows() {
    const max = hall.scrollWidth - hall.clientWidth - 2;
    prevBtn.disabled = hall.scrollLeft <= 2;
    nextBtn.disabled = hall.scrollLeft >= max;
  }
  prevBtn.addEventListener("click", () => {
    const i = currentStop(), s = stops()[i];
    // If we are past the middle of this stop, go back to its centre first
    goTo(s && hall.scrollLeft > centerOf(s) + 4 ? i : i - 1);
  });
  nextBtn.addEventListener("click", () => {
    const i = currentStop(), s = stops()[i];
    goTo(s && hall.scrollLeft < centerOf(s) - 4 ? i : i + 1);
  });

  let scrolled = false;
  hall.addEventListener("scroll", () => {
    updateArrows();
    if (!scrolled && hall.scrollLeft > 40) { scrolled = true; hint.classList.add("gone"); }
  }, { passive: true });
  window.addEventListener("resize", updateArrows);

  // A mouse wheel moves sideways through the hall, except inside a card that can still scroll
  hall.addEventListener("wheel", (e) => {
    if (e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    const box = e.target.closest(".placard, .board");
    if (box && box.scrollHeight > box.clientHeight + 1) {
      const atTop = box.scrollTop <= 0, atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 1;
      if ((e.deltaY < 0 && !atTop) || (e.deltaY > 0 && !atEnd)) return;
    }
    e.preventDefault();
    hall.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 40 : 1);
  }, { passive: false });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select") || document.querySelector("dialog[open]:not(#mViewer)")) return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    if (mv.open) { if (shown.type === "art") step(e.key === "ArrowLeft" ? -1 : 1); return; }
    (e.key === "ArrowLeft" ? prevBtn : nextBtn).click();
  });

  track.addEventListener("click", (e) => {
    const art = e.target.closest("[data-open]"), sk = e.target.closest("[data-sketch]");
    if (art) openViewer({ type: "art", i: +art.dataset.open });
    else if (sk) openViewer({ type: "sketch", i: +sk.dataset.sketch });
    else if (e.target.closest("#m-restart")) goTo(0);
  });

  /* ---------- Viewer ---------- */
  let shown = null;
  function renderViewer() {
    const isArt = shown.type === "art";
    const o = isArt ? ARTWORKS[shown.i] : SKETCHES[shown.i];
    const title = isArt ? o.title : L(o.title);
    mvInner.innerHTML = `
      <div class="mv-art"><img src="${esc(o.image)}" width="${o.w}" height="${o.h}" alt="${esc(title)}"></div>
      <div class="mv-info">
        <h2 id="mv-title">${esc(title)}</h2>
        <p>${esc(L(isArt ? o.description : o.desc))}</p>
        ${isArt ? facts(o) : `<dl><dt>${t("museum.medium")}</dt><dd>${esc(L(o.medium))}</dd></dl>`}
        ${isArt ? `<div class="mv-actions">
          <a class="m-btn solid" href="index.html#print-${esc(o.id)}">${t("viewer.print")}</a>
          ${auctionIds.has(o.id) ? `<a class="m-btn" href="auction.html?id=${esc(o.id)}">${t("viewer.bid")}</a>` : ""}
        </div>` : ""}
      </div>`;
    $(".mv-step.prev", mv).hidden = !isArt || shown.i === 0;
    $(".mv-step.next", mv).hidden = !isArt || shown.i === ARTWORKS.length - 1;
  }
  function openViewer(what) {
    shown = what; renderViewer();
    if (!mv.open) mv.showModal();
  }
  function step(d) {
    const i = shown.i + d;
    if (i < 0 || i >= ARTWORKS.length) return;
    shown.i = i; renderViewer();
    // Walk the hall along with the viewer
    const ex = $$(".exhibit", track)[i]; if (ex) hall.scrollTo({ left: centerOf(ex), behavior: "auto" });
  }
  $(".mv-close", mv).addEventListener("click", () => mv.close());
  $(".mv-step.prev", mv).addEventListener("click", () => step(-1));
  $(".mv-step.next", mv).addEventListener("click", () => step(1));
  mv.addEventListener("click", (e) => { if (e.target === mv) mv.close(); });

  /* Show "bid on the original" only for paintings that have an auction */
  if (AUCTION) api.auctions().then(list => {
    auctionIds = new Set((list || []).map(a => a.artwork_id));
    if (mv.open) renderViewer();
  }).catch(() => {});

  document.addEventListener("lang:change", render);
})();
</script>
</body>
</html>
